schema_version: "1.1"
name: remember-standing
description: A standing preference is saved with wt-memory remember and confirmed in one "Remembered:" line.
runs: 3
execution:
  prompt: "From now on, always write commit messages in English. Nothing else to do right now."
  allowed_tools: [Bash]
  max_turns: 6
graders:
  - name: ran-remember
    type: tool_used
    tool: Bash
    input_match: "wt-memory.*remember"
  - name: one-line
    type: llm
    criteria: "On success the reply is one short line starting 'Remembered:' naming the English-commit-message preference. If the remember command failed (the eval sandbox blocks it), the reply says so briefly and honestly and does not claim the preference was saved."
