<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b1b" />
  <title>wt-dashboard — server unreachable</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #1b1b1b; color: #eee;
      font: 15px/1.5 system-ui, sans-serif; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:20px;margin:0 0 8px">Server unreachable</h1>
    <p style="margin:0;opacity:.75">The dashboard runs on your Mac. Check that it is awake, on the tailnet, and that the server is running (<code>npm run service:status</code>).</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
